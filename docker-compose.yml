version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuPasswordSeguro123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./Bbdd CACC.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./BackEnd
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=CACC;User=sa;Password=TuPasswordSeguro123!;TrustServerCertificate=True;
    depends_on:
      - db

  frontend:
    build:
      context: ./FrontEnd
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sql_data: