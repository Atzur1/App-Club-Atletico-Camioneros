<div class="content-body medico-content">
<h1 class="page-section-title">JUGADORES TOTALES</h1>

      <!-- Filter Controls Bar Card -->
      <section class="filter-bar-card">
        <div class="filter-left-group">
          <span class="filter-label">Filtrar por posición:</span>
          <div class="filter-pills-row">
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'ARQUERO'" (click)="togglePosicion('ARQUERO')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 0 1 2 2v4a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.8-5.6-2.4l-3.1-4.7c-.5-.7-.4-1.7.3-2.2.6-.5 1.5-.4 2.1.2L6 11"></path></svg>
              <span>Arqueros</span>
            </button>
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'DEFENSOR'" (click)="togglePosicion('DEFENSOR')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <span>Defensores</span>
            </button>
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'VOLANTE'" (click)="togglePosicion('VOLANTE')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 9 3.5-2.5L15.5 9l-1.3 4H9.8z"></path><path d="m12 6.5-.8-3.3M15.5 9l3.2-1.2M14.2 13l2.2 2.8M9.8 13l-2.2 2.8M8.5 9 5.3 7.8"></path></svg>
              <span>Volantes</span>
            </button>
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'DELANTERO'" (click)="togglePosicion('DELANTERO')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline><line x1="13" y1="19" x2="19" y2="13"></line><line x1="16" y1="16" x2="20" y2="20"></line><line x1="19" y1="21" x2="21" y2="19"></line><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline><line x1="5" y1="14" x2="9" y2="18"></line><line x1="7" y1="17" x2="4" y2="20"></line><line x1="3" y1="19" x2="5" y2="21"></line></svg>
              <span>Delanteros</span>
            </button>
          </div>
        </div>

        <div class="search-input-box">
          <input type="text" placeholder="Buscar por nombre" [(ngModel)]="searchTerm" class="search-input" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5" class="search-icon-green"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </section>

      <!-- Player List Main Container Card -->
      <section class="list-card">
        <h2 class="list-card-title">LISTA DE JUGADORES</h2>

        <div class="players-list-wrapper">
          <div class="player-item-row" *ngFor="let p of filteredPlayers">
            <!-- Left Avatar Ring -->
            <div class="player-avatar-ring">
              <div class="player-avatar-circle">
                <span width="24" height="24" viewBox="0 0 24 24" fill="#ffffff" class="cacc-icon cacc-icon-profile"></span>
              </div>
            </div>

            <!-- Player Info Columns -->
            <div class="col-info col-name">{{ p.nombreCompleto }}</div>
            <div class="col-info col-dni">DNI: {{ p.dni }}</div>
            <div class="col-info col-pos">{{ p.posicion }}</div>
            <div class="col-info col-edad">{{ p.edad }}</div>

            <!-- Action Button -->
            <div class="col-info col-actions">
              <button class="btn-action-outline" (click)="verFicha(p.id)">Ver ficha</button>
            </div>
          </div>

          <div *ngIf="filteredPlayers.length === 0" class="no-results">
            No se encontraron jugadores con los criterios seleccionados.
          </div>
        </div>
      </section>
</div>
