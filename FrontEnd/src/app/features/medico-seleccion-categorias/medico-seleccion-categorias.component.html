<div class="content-body medico-content">
<h1 class="page-section-title">Categorias</h1>

      <!-- Filter Controls Bar Card -->
      <section class="filter-bar-card">
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.5" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Buscar por nombre de cat." [(ngModel)]="searchTerm" class="search-input" />
        </div>

        <div class="select-box">
          <select [(ngModel)]="asociacionFiltro">
            <option value="">Filtro de asociación</option>
            <option value="Liga Cordobesa">Liga Cordobesa</option>
            <option value="AFA">AFA</option>
          </select>
          <span class="select-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </span>
        </div>

        <div class="select-box">
          <select [(ngModel)]="ordenFiltro">
            <option value="">Ordenar por</option>
            <option value="nombre">Nombre</option>
          </select>
          <span class="select-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </span>
        </div>
      </section>

      <!-- Category List Main Container Card -->
      <section class="list-card">
        <h2 class="list-card-title">LISTA DE CATEGORIAS</h2>

        <div class="category-list-wrapper">
          <div class="category-item-row" *ngFor="let c of filteredCategorias">
            <!-- Left Avatar Ring with Group Icon -->
            <div class="category-avatar-ring">
              <div class="category-avatar-circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="3"></circle><circle cx="5" cy="9" r="2"></circle><circle cx="19" cy="9" r="2"></circle><path d="M6 20v-1a6 6 0 0 1 12 0v1"></path><path d="M1 20v-1a4 4 0 0 1 4-4"></path><path d="M23 20v-1a4 4 0 0 0-4-4"></path></svg>
              </div>
            </div>

            <!-- Category Info Columns -->
            <div class="col-info col-name">{{ c.nombre }}</div>
            <div class="col-info col-count">{{ c.cantidadJugadores }}</div>

            <!-- Action Button -->
            <div class="col-info col-actions">
              <button class="btn-action-outline" (click)="verCategoria(c.id)">Ver categoria</button>
            </div>
          </div>

          <div *ngIf="filteredCategorias.length === 0" class="no-results">
            No se encontraron categorías con los filtros seleccionados.
          </div>
        </div>
      </section>
</div>
