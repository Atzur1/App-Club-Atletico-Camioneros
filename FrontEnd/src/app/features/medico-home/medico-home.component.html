<div class="content-body medico-content">
<!-- KPI Stat Cards Container -->
      <section class="kpi-cards-grid">
        <div class="kpi-card" *ngFor="let card of kpiCards">
          <div class="kpi-card-content">
            <div class="kpi-icon-box">
              <span *ngIf="card.type === 'jugadores'" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="#007A3D" stroke-width="2.5" class="cacc-icon cacc-icon-tutor"></span>
              <svg *ngIf="card.type === 'aptos'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007A3D"
                stroke-width="2.5">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </div>
            <span class="kpi-title">{{ card.title }}</span>
            <div class="kpi-value">{{ card.value }}</div>
          </div>
          <!-- Decorative Mint Green Slope Corner -->
          <div class="kpi-decor-shape"></div>
        </div>
      </section>

      <!-- Main Data Table Container -->
      <section class="table-card">
        <!-- Control Bar: Search & Action Filters -->
        <div class="table-controls">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5"
              class="search-icon">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Buscar por DNI o Nombre" [(ngModel)]="searchTerm" class="search-input" />
          </div>

          <div class="select-box">
            <select [(ngModel)]="categoriaFiltro">
              <option value="">Filtro de Categoria</option>
              <option value="CEBOLLITAS">Cebollitas</option>
              <option value="INFANTIL">Infantil</option>
              <option value="JUVENIL">Juvenil</option>
            </select>
            <span class="select-arrow">❯</span>
          </div>

          <div class="select-box">
            <select [(ngModel)]="ordenFiltro">
              <option value="">Ordenar por</option>
              <option value="nombre">Nombre</option>
              <option value="dni">DNI</option>
              <option value="categoria">Categoría</option>
            </select>
            <span class="select-arrow">❯</span>
          </div>
        </div>

        <!-- Data Table -->
        <div class="table-responsive">
          <table class="cacc-table">
            <thead>
              <tr>
                <th>[Foto]</th>
                <th>[Nombre Completo]</th>
                <th>[DNI]</th>
                <th>[Categoria]</th>
                <th>[F. Nacimiento]</th>
                <th>[Acciones]</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of players">
                <td class="col-foto">
                  <div class="user-avatar-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff">
                      <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                    </svg>
                  </div>
                </td>
                <td class="col-nombre">{{ p.nombreCompleto }}</td>
                <td class="col-dni">{{ p.dni }}</td>
                <td class="col-categoria">{{ p.categoria }}</td>
                <td class="col-nacimiento">{{ p.fechaNacimiento }}</td>
                <td class="col-acciones">
                  <div class="actions-wrapper">
                    <button class="action-btn view-btn" title="Ver Ficha / Perfil Jugador" (click)="viewFicha(p)">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>

              <!-- Additional Empty Rows matching original image layout -->
              <tr class="empty-row">
                <td colspan="6">&nbsp;</td>
              </tr>
              <tr class="empty-row">
                <td colspan="6">&nbsp;</td>
              </tr>
              <tr class="empty-row">
                <td colspan="6">&nbsp;</td>
              </tr>
              <tr class="empty-row">
                <td colspan="6">&nbsp;</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
</div>
